<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" viewBox="0 0 760 470" role="img" aria-label="Proa a la derecha: babor queda arriba y estribor abajo" font-size="13"><rect width="760" height="470" fill="#ffffff"/><defs><marker id="boat-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6569"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#182022">Mirando a proa, babor está a la izquierda y estribor a la derecha</text><text x="24" y="48" font-size="11.5" fill="#5a6569">Arriba, el barco visto desde arriba; abajo, de perfil con sus dimensiones</text><g><path d="M140 120 L440 120 Q530 128 560 170 Q530 212 440 220 L140 220 Z" fill="none" stroke="#5a6569" stroke-width="1.25"></path><line x1="144" y1="170" x2="556" y2="170" stroke="#5a6569" stroke-width="1" stroke-dasharray="5 4"></line><circle cx="470" cy="127" r="5" fill="#c62828"></circle><circle cx="470" cy="213" r="5" fill="#2e7d32"></circle><line x1="290" y1="120" x2="290" y2="220" stroke="#c9d2d5"></line><line x1="440" y1="120" x2="440" y2="220" stroke="#c9d2d5"></line></g><text x="150" y="163" font-size="11.5" fill="#5a6569">Línea de crujía</text><text x="350" y="84" text-anchor="middle" font-weight="600" fill="#182022">BABOR · luz roja</text><text x="215" y="108" text-anchor="middle" font-size="11.5" fill="#5a6569">Aleta</text><text x="365" y="108" text-anchor="middle" font-size="11.5" fill="#5a6569">Través</text><text x="500" y="108" text-anchor="middle" font-size="11.5" fill="#5a6569">Amura</text><text x="215" y="240" text-anchor="middle" font-size="11.5" fill="#5a6569">Aleta</text><text x="365" y="240" text-anchor="middle" font-size="11.5" fill="#5a6569">Través</text><text x="500" y="240" text-anchor="middle" font-size="11.5" fill="#5a6569">Amura</text><text x="350" y="264" text-anchor="middle" font-weight="600" fill="#182022">ESTRIBOR 