boat-arrow)"></line><line x1="660" y1="394" x2="660" y2="430" stroke="#5a6569" stroke-width="1.25" marker-start="url(#boat-arrow)" marker-end="url(#boat-arrow)"></line><text x="670" y="375" font-size="12" fill="#182022">Francobordo</text><text x="670" y="416" font-size="12" fill="#182022">Calado</text></g><text x="24" y="458" font-size="11.5" fill="#5a6569">Puntal ≈ francobordo + calado. El calado se mide desde la flotación hasta el punto más bajo.</text></svg>
