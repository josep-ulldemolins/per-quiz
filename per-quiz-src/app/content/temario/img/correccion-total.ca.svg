<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" viewBox="0 0 760 352" role="img" aria-label="De rumb d&#x27;agulla a rumb vertader amb el corrector total" font-size="13"><rect width="760" height="352" fill="#ffffff"/><defs><marker id="ct-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6569"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#182022">A la carta sempre es treballa amb el rumb vertader</text><text x="24" y="48" font-size="11.5" fill="#5a6569">El corrector total (Ct) uneix el que marca l&#x27;agulla amb el que dibuixes a la carta</text><g><rect x="24" y="80" width="196" height="70" rx="8" fill="#1b6e66" fill-opacity="0.12" stroke="#1b6e66" stroke-width="2"></rect><text x="122" y="110" text-anchor="middle" font-weight="600" fill="#182022">Rumb vertader (Rv)</text><text x="122" y="130" text-anchor="middle" font-size="11.5" fill="#5a6569">el que dibuixes a la carta</text></g><g><rect x="282" y="80" width="196" height="70" rx="8" fill="none" fill-opacity="1" stroke="#5a6569" stroke-width="1.25"></rect><text x="380" y="110" text-anchor="middle" font-weight="600" fill="#182022">Rumb magnètic (Rm)</text><text x="380" y="130" text-anchor="middle" font-size="11.5" fill="#5a6569">respecte del nord magnètic</text></g><g><rect x="540" y="80" width="196" height="70" rx="8" fill="none" fill-opacity="1" stroke="#5a6569" stroke-width="1.25"></rect><text x="638" y="110" text-anchor="middle" font-weight="600" fill="#182022">Rumb d&#x27;agulla (Ra)</text><text x="638" y="130" text-anchor="middle" font-size="11.5" fill="#5a6569">el que marca la teva agulla</text></g><g fill="none" stroke="#5a6569" stroke-width="1.25"><path d="M222 115H280" marker-start="url(#ct-arrow)" marker-end="url(#ct-arrow)"></path><path d="M480 115H538" marker-start="url(#ct-arrow)" marker-end="url(#ct-arrow)"></path></g><text x="251" y="174" text-anchor="middle" font-size="11.5" fill="#182022">declinació (dm)</text><text x="509" y="174" text-anchor="middle" font-size="11.5" fill="#182022">desvi (Δ)</text><g fill="none" stroke="#5a6569" stroke-width="1.25"><path d="M122 150V266" stroke="#c9d2d5" stroke-dasharray="3 3"></path><path d="M638 150V266" stroke="#c9d2d5" stroke-dasharray="3 3"></path><path d="M638 214H126" marker-end="url(#ct-arrow)"></path><path d="M122 262H634" marker-end="url(#ct-arrow)"></path></g><text x="380" y="206" text-anchor="middle" font-weight="600" fill="#182022">De l&#x27;agulla a la carta: Rv = Ra + Ct</text><text x="380" y="254" text-anchor="middle" font-weight="600" fill="#182022">De la carta a l&#x27;agulla: Ra = Rv − Ct</text><g><rect x="24" y="290" width="712" height="42" rx="8" fill="#eef3f4" stroke="#5a6569" stroke-width="1.25"></rect><text x="380" y="315" text-anchor="middle" fill="#182022">Ct = dm + Δ · Est (E) positiu, Oest (W) negatiu</text></g></svg>
