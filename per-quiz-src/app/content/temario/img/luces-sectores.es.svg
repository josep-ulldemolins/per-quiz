<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" viewBox="0 0 760 500" role="img" aria-label="Sectores de las luces de navegación de un buque de motor" font-size="13"><rect width="760" height="500" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#182022">Cada luz cubre un sector fijo: así sabes hacia dónde va un barco de noche</text><text x="24" y="48" font-size="11.5" fill="#5a6569">Buque de motor visto desde arriba, con la proa hacia arriba</text><g><path d="M181.36590051007332 382.2769379584943 A215 215 0 1 1 578.6340994899267 382.2769379584943" fill="none" stroke="#5a6569" stroke-width="1.5" stroke-dasharray="6 5"></path><line x1="380" y1="300" x2="181.36590051007332" y2="382.2769379584943" stroke="#5a6569" stroke-dasharray="6 5"></line><line x1="380" y1="300" x2="578.6340994899267" y2="382.2769379584943" stroke="#5a6569" stroke-dasharray="6 5"></line><text x="380" y="76" text-anchor="middle" font-weight="600" fill="#182022">Tope: blanca · 225°</text></g><g><path d="M380 300 L380 120 A180 180 0 0 1 546.2983158520316 368.88301782571614 Z" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="1.25"></path><text x="484" y="226" text-anchor="middle" font-weight="600" fill="#182022">Costado verde</text><text x="484" y="242" text-anchor="middle" font-size="11.5" fill="#182022">112,5°</text></g><g><path d="M380 300 L213.70168414796836 368.88301782571614 A180 180 0 0 1 379.99999999999994 120 Z" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="1.25"></path><text x="276" y="226" text-anchor="middle" font-weight="600" fill="#182022">Costado rojo</text><text x="276" y="242" text-anchor="middle" font-size="11.5" fill="#182022">112,5°</text></g><g><path d="M380 300 L518.581929876693 357.40251485476347 A150 150 0 0 1 241.41807012330696 357.4025148547634 Z" fill="#eef3f4" stroke="#5a6569" stroke-width="1.25"></path><text x="380" y="404" text-anchor="middle" font-weight="600" fill="#182022">Alcance: blanca</text><text x="380" y="420" text-anchor="middle" font-size="11.5" fill="#182022">135°</text></g><path d="M380 268 Q394 288 392 330 L368 330 Q366 288 380 268 Z" fill="#1b6e66" fill-opacity="0.18" stroke="#1b6e66" stroke-width="2"></path><text x="604" y="304" font-size="11.5" font-weight="600" fill="#5a6569">ESTRIBOR</text><text x="156" y="304" text-anchor="end" font-size="11.5" font-weight="600" fill="#5a6569">BABOR</text><text x="24" y="470" font-size="11.5" fill="#5a6569">Tope y costados llegan hasta 22,5° a popa del través; la luz de alcance cubre el resto.</text><text x="24" y="486" font-size="11.5" fill="#5a6569">Si solo ves la blanca de alcance de un barco, lo estás alcanzando.</text></svg>
