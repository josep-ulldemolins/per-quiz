<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" viewBox="0 0 760 356" role="img" aria-label="Quién se aparta en cruce, de vuelta encontrada y alcance" font-size="13"><rect width="760" height="356" fill="#ffffff"/><defs><marker id="ripa-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b6e66"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#182022">Quién se aparta: el barco en color maniobra, el otro mantiene rumbo</text><text x="24" y="48" font-size="11.5" fill="#5a6569">Dos buques de motor vistos desde arriba · la línea discontinua es la maniobra</text><g><rect x="24" y="64" width="228" height="272" rx="8" fill="none" stroke="#c9d2d5"></rect><text x="138" y="90" text-anchor="middle" font-weight="600" fill="#182022">Cruce (regla 15)</text><path d="M138 232 C140 196 196 214 236 178" fill="none" stroke="#1b6e66" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ripa-arrow)"></path><g transform="translate(138 250) rotate(0)"><path d="M0 -18 Q10 -6 9 14 L-9 14 Q-10 -6 0 -18 Z" fill="#1b6e66" fill-opacity="0.18" stroke="#1b6e66" stroke-width="2"></path></g><g transform="translate(200 160) rotate(270)"><path d="M0 -18 Q10 -6 9 14 L-9 14 Q-10 -6 0 -18 Z" fill="none" fill-opacity="1" stroke="#5a6569" stroke-width="1.25"></path></g><text x="118" y="254" text-anchor="end" font-size="11.5" font-weight="600" fill="#182022">A se aparta</text><text x="200" y="136" text-anchor="middle" font-size="11.5" fill="#5a6569">B mantiene</text><text x="138" y="300" text-anchor="middle" font-size="11.5" fill="#182022">Se aparta quien ve al otro</text><text x="138" y="316" text-anchor="middle" font-size="11.5" fill="#182022">por su costado de estribor</text></g><g><rect x="266" y="64" width="228" height="272" rx="8" fill="none" stroke="#c9d2d5"></rect><text x="380" y="90" text-anchor="middle" font-weight="600" fill="#182022">Vuelta encontrada (regla 14)</text><path d="M380 234 Q386 200 420 186" fill="none" stroke="#1b6e66" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ripa-arrow)"></path><path d="M380 140 Q374 174 340 188" fill="none" stroke="#1b6e66" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ripa-arrow)"></path><g transform="translate(380 252) rotate(0)"><path d="M0 -18 Q10 -6 9 14 L-9 14 Q-10 -6 0 -18 Z" fill="#1b6e66" fill-opacity="0.18" stroke="#1b6e66" stroke-width="2"></path></g><g transform="translate(380 122) rotate(180)"><path d="M0 -18 Q10 -6 9 14 L-9 14 Q-10 -6 0 -18 Z" fill="#1b6e66" fill-opacity="0.18" stroke="#1b6e66" stroke-width="2"></path></g><text x="380" y="300" text-anchor="middle" font-size="11.5" fill="#182022">Los dos caen a estribor</text><text x="380" y="316" text-anchor="middle" font-size="11.5" fill="#182022">y se cruzan por babor</text></g><g><rect x="508" y="64" width="228" height="272" rx="8" fill="none" stroke="#c9d2d5"></rect><text x="622" y="90" text-anchor="middle" font-weight="600" fill="#182022">Alcance (regla 13)</text><path d="M622 232 Q672 196 664 132" fill="none" stroke="#1b6e66" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ripa-arrow)"></path><g transform="translate(622 250) rotate(0)"><path d="M0 -18 Q10 -6 9 14 L-9 14 Q-10 -6 0 -18 Z" fill="#1b6e66" fill-opacity="0.18" stroke="#1b6e66" stroke-width="2"></path></g><g transform="translate(622 150) rotate(0)"><path d="M0 -18 Q10 -6 9 14 L-9 14 Q-10 -6 0 -18 Z" fill="none" fill-opacity="1" stroke="#5a6569" stroke-width="1.25"></path></g><text x="600" y="154" text-anchor="end" font-size="11.5" fill="#5a6569">Alcanzado mantiene</text><text x="600" y="254" text-anchor="end" font-size="11.5" font-weight="600" fill="#182022">Alcanzante</text><text x="622" y="300" text-anchor="middle" font-size="11.5" fill="#182022">El que alcanza siempre se aparta,</text><text x="622" y="316" text-anchor="middle" font-size="11.5" fill="#182022">sea de motor o de vela</text></g></svg>
